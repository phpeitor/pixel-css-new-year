<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Genera animales Pixel Art con matrices y CSS box-shadow.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='75'>👾</text></svg>">
    <title>Pixel Fauna - Generador CSS Pixel Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <video class="bg-video" autoplay loop muted playsinline aria-hidden="true">
        <source src="./resources/fondo.mp4" type="video/mp4">
    </video>

    <header class="site-header">
        <div class="logo" role="button" tabindex="0" aria-label="Ampliar logo" aria-haspopup="dialog">
            <div class="box">
                <img src="./resources/logo.png" alt="Logo Phpeitor con ilustración pixel art" width="456" height="190" />
            </div>
        </div>
    </header>

    <main class="app-shell">

        <section class="generator" aria-label="Generador de animales Pixel Art">
            <div class="selector-panel">
                <div class="panel-heading">
                    <div>
                        <span class="step">PASO 01</span>
                        <h2>Sube una imagen o elige un animal</h2>
                    </div>
                    <span id="animal-count" class="animal-count" aria-live="polite">-- criaturas</span>
                </div>

                <section class="image-import" aria-labelledby="image-import-title">
                    <input id="image-input" class="visually-hidden" type="file" accept="image/*">
                    <label id="image-dropzone" class="image-dropzone" for="image-input">
                        <span class="upload-icon" aria-hidden="true">↑</span>
                        <span><strong>Seleccionar imagen</strong><small>PNG, JPG, GIF o WebP · máx. 10 MB</small></span>
                    </label>
                    <div class="image-settings">
                        <label class="background-toggle" for="remove-bg-ai">
                            <input id="remove-bg-ai" type="checkbox" checked>
                            <span>Quitar fondo con IA</span>
                        </label>
                        <label class="background-toggle" for="remove-white-background">
                            <input id="remove-white-background" type="checkbox" checked>
                            <span>Usar fondo blanco si la IA no está disponible</span>
                        </label>
                        <label for="pixel-resolution">Resolución <output id="resolution-value">32 px</output></label>
                        <input id="pixel-resolution" type="range" min="16" max="48" step="4" value="32">
                        <label for="palette-size">Colores <output id="palette-value">8</output></label>
                        <input id="palette-size" type="range" min="4" max="16" step="2" value="8">
                    </div>
                    <p id="image-feedback" class="image-feedback" role="status" aria-live="polite" hidden></p>
                </section>

                <div id="animal-list" class="animal-list" role="list" aria-busy="true"></div>

                <p id="catalog-error" class="error-message" role="alert" hidden></p>
            </div>

            <div class="preview-panel">
                <div class="preview-topbar">
                    <span>PREVISUALIZACIÓN</span>
                    <span id="matrix-size">MATRIZ -- x --</span>
                </div>

                <div id="pixel-stage" class="pixel-stage" aria-live="polite">
                    <div id="empty-state" class="empty-state">
                        <span class="empty-icon" aria-hidden="true">?</span>
                        <p>Elige una criatura<br>para comenzar</p>
                    </div>
                    <div id="loader" class="loader" hidden aria-label="Generando Pixel Art">
                        <div class="loader-square"></div>
                        <div class="loader-pixels" aria-hidden="true">
                            <span></span><span></span><span></span><span></span>
                        </div>
                        <span>GENERANDO PÍXELES…</span>
                    </div>
                    <div id="pixel-result" class="pixel-result" hidden>
                        <div id="pixel-art" class="pixel-art"></div>
                    </div>
                </div>

                <div class="preview-footer">
                    <div>
                        <span class="result-label">CRIATURA GENERADA</span>
                        <strong id="result-name">SIN SELECCIÓN</strong>
                    </div>
                    <div class="footer-actions">
                        <div class="css-badge"><span aria-hidden="true">◆</span> BOX-SHADOW</div>
                        <button id="copy-btn" class="copy-btn" type="button" disabled>
                            <span class="copy-label">COPIAR CÓDIGO</span>
                        </button>
                    </div>
                </div>
                <p id="copy-feedback" class="copy-feedback" role="status" aria-live="polite" hidden></p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>HECHO CON HTML + CSS + PHP</span>
        <span>TUS IMÁGENES, CONVERTIDAS EN PÍXELES.</span>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
